name: CI

# **푸시하면 이것이 돈다. 배포는 하지 않는다.**
#
# 배포(`deploy.yml`)와 이 검사를 **일부러 갈라 두었다.** 예전에는 master 푸시가 곧
# 사이트 갱신이라 손이 굳었고(고치는 중인 것을 올려 두기가 어렵다), 그래서 배포를
# 손으로만 누르게 바꾸면서 **검사까지 함께 꺼졌다.** 그 뒤로는 `npm run ci` 를 손으로
# 돌려야만 확인이 되었고, 안 돌리고 올리면 아무도 빨간불을 켜 주지 않았다.
# 여기서 검사만 되살린다 — **푸시는 검사를 부르고, 배포는 여전히 손으로만 눌린다.**
#
# 하는 일은 `npm run ci` 한 줄이다. 무엇을 돌릴지는 **`package.json` 과 그것이 부르는 `tools/run.mjs` 에만** 적혀 있으므로
# 검사를 더해도 이 파일은 고칠 것이 없다.
#
# **배포가 이 워크플로의 결과를 보지는 않는다.** 볼 필요가 없다 — `deploy.yml` 의 build 잡이
# **제 손으로 같은 `npm run ci` 를 돌리고**, deploy-pages 는 그 잡이 성공해야만 돈다.
# 다른 워크플로의 성공 여부를 물어보는 방식은 「검사가 지나간 뒤에 밀어 넣은 커밋」을
# 놓치지만, 배포가 제자리에서 다시 검사하면 그럴 틈이 없다.

on:
  # 가지를 적으면 **태그 푸시는 걸리지 않는다.** 태그는 이미 검사가 지나간 나무를
  # 가리키는 이름표일 뿐이라, 같은 것을 한 번 더 돌릴 까닭이 없다.
  push:
    branches: [ '**' ]
  # 이 저장소는 master 에 바로 커밋한다. 같은 저장소의 가지에서 올린 PR 은 그 가지의
  # 푸시가 이미 여기 걸리므로 `pull_request:` 를 더하면 같은 나무를 두 번 검사한다.
  # **바깥에서 오는 PR 을 받기 시작하면** 그때 이 줄을 살린다.
  # pull_request:
  workflow_dispatch: { }

# 배포 권한을 주지 않는다. 이 워크플로는 **읽고 검사하기만 한다.**
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # 같은 가지에 잇달아 푸시하면 앞엣것은 끊는다. 마지막 것만 초록이면 된다.
    # (배포 쪽은 반대로 끊지 않는다 — 끊긴 배포는 사이트를 반쯤 갱신된 채로 남긴다.)
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      # 검사는 전부 Node(Vitest)로 돈다. 파이썬을 따로 깔지 않는다.
      # `code` 검사는 강의노트의 `.py` 와 `.c` 를 그 언어의 컴파일러(python3 · gcc)로 구문만 본다 —
      # 러너(ubuntu)에 둘 다 들어 있어 여기서는 건너뛰지 않는다. **가진 것이 다르니 로컬보다 여기서 더 본다.**

      # ⚠ 아래 두 줄은 이름만 닮았지 다른 명령이다. 중복이 아니므로 지우지 말 것.
      #   `npm ci`     — npm의 **설치** 명령(락파일대로 node_modules를 새로 깐다)
      #   `npm run ci` — 이 저장소의 **검사** 스크립트(package.json에 정의)
      - name: Install dependencies (npm clean-install)
        run: npm ci

      # 레이아웃 검사(`check -- layout`)가 진짜 브라우저로 잰다. 락파일이 정한 Playwright 판에 맞는
      # Chromium 과 그것이 쓰는 시스템 라이브러리를 깐다.
      - name: Install Chromium for layout checks
        run: npx playwright install --with-deps chromium

      # 검사 → 빌드 → 산출물 검사. 로컬에서 치는 것과 **같은 한 줄**이다.
      - name: Check, build, verify (npm run ci)
        run: npm run ci
