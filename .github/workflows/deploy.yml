name: Build & Deploy

# 소스는 항상 CDN 그대로 둔다. 이 워크플로가 CDN 자산을 전부 로컬 파일로 바꾼
# 정적 번들 하나를 만들고, 그 하나를 Pages와 릴리즈 zip에 똑같이 쓴다.
#
# 산출물을 하나로 둔 이유 — 예전에는 Pages용(CDN 유지)과 zip용(로컬화)을 따로
# 만들었는데, zip은 아무도 열어 보지 않아 결함이 그쪽에만 조용히 쌓였다.
# 실제로 프로그래밍(Python)/1-1-2의 아이콘 색이 zip에서만 빠진 채 오래 남아 있었다.
# 같은 파일을 서빙하면 사이트를 보는 사람이 곧 번들의 검증자가 된다.
#
# dist/ 는 어떤 경우에도 저장소에 커밋되지 않는다.
#
# master 푸시가 곧 사이트 갱신이다.
# 최초 1회 설정 — Settings → Pages → Source를 "GitHub Actions"로 바꿔야 한다.

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch: { }

permissions:
  contents: write # 릴리즈 자산 업로드
  pages: write # Pages 배포
  id-token: write # Pages 배포

env:
  ZIP_NAME: lecture-notes-offline.zip
  RELEASE_TAG: offline-latest

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          # 락파일이 둘이다 — docx 생성기와 빌드 스크립트의 tailwind.
          cache-dependency-path: |
            tools/docx/package-lock.json
            .github/scripts/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # 아래 단계들은 전부 package.json의 npm 스크립트를 부른다. 로컬에서 치는
      # 명령과 CI가 돌리는 명령이 같아야 하기 때문이다. 캐시 단계를 사이에 끼워야
      # 해서 `npm run ci` 하나로 묶지 않고 조각으로 부른다 — 조각의 정의는
      # package.json 한 곳에만 있다.
      - name: Install dependencies (docx generator, tailwindcss)
        run: npm run setup

      # 소스 검사라 빌드보다 먼저 돌린다. 클래스를 코드로 조립하면 Tailwind가
      # 리터럴을 못 찾아 CSS에서 빠지는데, 소스를 그대로 열면(CDN, 런타임 JIT)
      # 멀쩡히 보여서 눈으로는 안 잡힌다. 강의노트가 끌어다 쓰는 .py·.c의 구문과
      # data-src 마커도 함께 본다 — 러너에 gcc가 있어 .c까지 검사된다.
      - name: Check sources
        run: npm run check

      - name: Cache CDN assets (Font Awesome, Pretendard, MathJax, vendor JS)
        uses: actions/cache@v6
        with:
          # build_site.py가 CDN에서 받은 것만 assets/cdn/ 밑에 모으고, 파일마다
          # 매번 새로 빌드되는 assets/css/는 따로 둔다 — 그래서 cdn/ 통째로 캐싱해도
          # 삭제·개명된 강의노트의 옛 css가 캐시에 쌓이는 일이 없다.
          path: dist-assets-cache
          # 자산 URL·버전은 build_site.py 안에 박혀 있으므로, 그 파일이
          # 바뀔 때만(=버전이 바뀔 때만) 캐시를 새로 받는다.
          key: offline-assets-${{ hashFiles('.github/scripts/build_site.py') }}

      - name: Restore cache into dist/assets/cdn
        run: |
          mkdir -p dist/assets/cdn
          if [ -d dist-assets-cache ] && [ -n "$(ls -A dist-assets-cache 2>/dev/null)" ]; then
            cp -r dist-assets-cache/. dist/assets/cdn/
            echo "캐시된 자산 재사용"
          else
            echo "캐시 없음 — 이번 실행에서 전부 새로 받음"
          fi

      - name: Build site (CDN localized, .docx generated, code injected)
        run: npm run build

      - name: Update asset cache for next run
        run: |
          rm -rf dist-assets-cache
          cp -r dist/assets/cdn dist-assets-cache

      # 산출물 검사 — 소스만 봐서는 알 수 없는 셋을 본다.
      # .docx 다운로드 링크, 로컬화되지 않은 CDN 참조, 태그 중첩.
      - name: Check build output
        run: python tools/check_dist.py dist --github

      - name: Record build info
        id: meta
        run: |
          echo "built_at=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"
          cat > dist/BUILD_INFO.txt <<EOF
          Built at: $(date -u +'%Y-%m-%d %H:%M UTC')
          Commit: ${{ github.sha }}
          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Create zip archive
        run: cd dist && zip -rq "../${{ env.ZIP_NAME }}" .

      - name: Publish release (fixed tag offline-latest, overwritten each run)
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Offline Bundle (auto-updated)
          body: |
            Automatically built offline bundle — the same files served at the site.

            - Built at: ${{ steps.meta.outputs.built_at }}
            - Commit: ${{ github.sha }}
          make_latest: false
          files: ${{ env.ZIP_NAME }}

  deploy-pages:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # 배포는 중간에 끊지 않는다. 끊긴 배포는 사이트를 반쯤 갱신된 상태로 남긴다.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
