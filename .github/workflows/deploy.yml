name: Build & Deploy

# 소스는 항상 CDN 그대로 둔다. 이 워크플로가 CDN 자산을 전부 로컬 파일로 바꾼
# 정적 번들 하나를 만들고, 그 하나를 Pages와 릴리즈 zip에 똑같이 쓴다.
#
# 산출물을 하나로 둔 이유 — 예전에는 Pages용(CDN 유지)과 zip용(로컬화)을 따로
# 만들었는데, zip은 아무도 열어 보지 않아 결함이 그쪽에만 조용히 쌓였다.
# 실제로 프로그래밍(Python)/1-1-2의 아이콘 색이 zip에서만 빠진 채 오래 남아 있었다.
# 같은 파일을 서빙하면 사이트를 보는 사람이 곧 번들의 검증자가 된다.
#
# dist/ 는 어떤 경우에도 저장소에 커밋되지 않는다.
#
# master 푸시가 곧 사이트 갱신이다.
# 최초 1회 설정 — Settings → Pages → Source를 "GitHub Actions"로 바꿔야 한다.

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch: { }

permissions:
  contents: write # 릴리즈 자산 업로드
  pages: write # Pages 배포
  id-token: write # Pages 배포

env:
  ZIP_NAME: lecture-notes-offline.zip
  RELEASE_TAG: offline-latest

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/docx/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci && npm run setup

      # 검사 → 빌드 → 산출물 검사. 로컬에서 치는 것과 **같은 한 줄**이다.
      # 무엇을 돌릴지는 package.json에만 적혀 있다.
      - name: npm run ci
        run: npm run ci

      - name: Record build info
        id: meta
        run: |
          echo "built_at=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"
          cat > dist/BUILD_INFO.txt <<EOF
          Built at: $(date -u +'%Y-%m-%d %H:%M UTC')
          Commit: ${{ github.sha }}
          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Create zip archive
        run: cd dist && zip -rq "../${{ env.ZIP_NAME }}" .

      - name: Publish release (fixed tag offline-latest, overwritten each run)
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Offline Bundle (auto-updated)
          body: |
            Automatically built offline bundle — the same files served at the site.

            - Built at: ${{ steps.meta.outputs.built_at }}
            - Commit: ${{ github.sha }}
          make_latest: false
          files: ${{ env.ZIP_NAME }}

  deploy-pages:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # 배포는 중간에 끊지 않는다. 끊긴 배포는 사이트를 반쯤 갱신된 상태로 남긴다.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
