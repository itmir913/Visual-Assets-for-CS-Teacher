name: Build & Deploy

# 소스에는 CDN이 없다. 의존성은 전부 npm이고 Vite가 묶는다(2026-08-11 전환).
# 이 워크플로가 하는 일은 `npm run ci` 한 줄뿐이고, 거기서 나온 `dist/` **하나를**
# Pages와 릴리즈 zip에 똑같이 쓴다.
#
# 산출물을 하나로 둔 이유 — 예전에는 Pages용과 zip용을 따로 만들었는데,
# zip은 아무도 열어 보지 않아 결함이 그쪽에만 조용히 쌓였다.
# 실제로 프로그래밍(Python)/1-1-2의 아이콘 색이 zip에서만 빠진 채 오래 남아 있었다.
# 같은 파일을 서빙하면 사이트를 보는 사람이 곧 번들의 검증자가 된다.
#
# dist/ 는 어떤 경우에도 저장소에 커밋되지 않는다.
#
# master 푸시가 곧 사이트 갱신이다.
# 최초 1회 설정 — Settings → Pages → Source를 "GitHub Actions"로 바꿔야 한다.

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch: { }

permissions:
  contents: write # 릴리즈 자산 업로드
  pages: write # Pages 배포
  id-token: write # Pages 배포

env:
  # zip 이름 뒤에는 빌드 시각이 붙는다 — `lecture-notes-offline-20260823-1530.zip`.
  # 이름이 매번 달라지므로 **다운로드 주소를 손으로 적을 수 없다.**
  # 링크를 거는 쪽(index.html·README)은 릴리즈 페이지를 가리키고,
  # 직접 주소는 API로 자산 목록을 받아 얻는다.
  ZIP_PREFIX: lecture-notes-offline
  RELEASE_TAG: offline-latest

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # ⚠ 아래 두 줄은 이름만 닮았지 다른 명령이다. 중복이 아니므로 지우지 말 것.
      #   `npm ci`     — npm의 **설치** 명령(락파일대로 node_modules를 새로 깐다)
      #   `npm run ci` — 이 저장소의 **검사** 스크립트(package.json에 정의)
      - name: Install dependencies (npm clean-install)
        run: npm ci

      # 검사 → 빌드 → 산출물 검사. 로컬에서 치는 것과 **같은 한 줄**이다.
      # 무엇을 돌릴지는 package.json에만 적혀 있다.
      - name: Check, build, verify (npm run ci)
        run: npm run ci

      # 시각은 **한 번만** 읽는다. 두 번 부르면 분이 바뀌는 순간에
      # 파일 이름과 BUILD_INFO.txt가 1분 어긋난다.
      #
      # 표기는 KST다. 러너는 UTC로 도므로 9시간을 **더해서** 만든다 —
      # `TZ=Asia/Seoul`은 러너에 시간대 자료가 있어야 듣지만, 이 계산은
      # 아무 데서나 같은 값을 낸다. 한국은 서머타임이 없어 더하기로 끝난다.
      - name: Record build info
        id: meta
        run: |
          now=$(( $(date -u +%s) + 9 * 3600 ))
          stamp=$(date -u -d "@$now" +'%Y%m%d-%H%M')
          built_at=$(date -u -d "@$now" +'%Y-%m-%d %H:%M KST')
          echo "built_at=$built_at" >> "$GITHUB_OUTPUT"
          echo "zip_name=${{ env.ZIP_PREFIX }}-$stamp.zip" >> "$GITHUB_OUTPUT"
          cat > dist/BUILD_INFO.txt <<EOF
          Built at: $built_at
          Commit: ${{ github.sha }}
          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Create zip archive
        run: cd dist && zip -rq "../${{ steps.meta.outputs.zip_name }}" .

      - name: Publish release (fixed tag offline-latest, overwritten each run)
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Offline Bundle (auto-updated)
          body: |
            Automatically built offline bundle — the same files served at the site.

            - Built at: ${{ steps.meta.outputs.built_at }}
            - Commit: ${{ github.sha }}
          make_latest: false
          files: ${{ steps.meta.outputs.zip_name }}

      # 이름이 매번 달라져 옛 zip이 덮어써지지 않고 쌓인다. 방금 올린 것만 남긴다.
      # **올린 뒤에 지운다** — 먼저 지우면 그 사이에 자산이 하나도 없는 릴리즈가 된다.
      - name: Prune older assets
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: ${{ steps.meta.outputs.zip_name }}
        run: |
          # 지울 것이 없으면 grep이 1로 끝난다. 기본 셸이 pipefail이라 그대로 두면
          # 「깨끗한 릴리즈」가 빨간불이 된다.
          { gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' \
            | grep -vxF "$KEEP" || true; } \
            | while read -r name; do
                echo "deleting $name"
                gh release delete-asset "$RELEASE_TAG" "$name" --yes
              done

  deploy-pages:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # 배포는 중간에 끊지 않는다. 끊긴 배포는 사이트를 반쯤 갱신된 상태로 남긴다.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
