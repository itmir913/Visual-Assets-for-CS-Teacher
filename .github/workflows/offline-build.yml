name: Offline Build

# 소스는 항상 CDN 그대로 둔다. 이 워크플로는 master에 푸시될 때마다
# CDN 자산을 전부 로컬화한 정적 번들을 만들어 releases/download/offline-latest/
# 에 zip 하나로 올린다. dist/·css/·assets/는 어떤 경우에도 저장소에 커밋되지 않는다.

on:
  push:
    branches: [master]
  workflow_dispatch: { }

concurrency:
  group: offline-build
  cancel-in-progress: true

permissions:
  contents: write # 릴리즈 자산 업로드에 필요

env:
  ZIP_NAME: lecture-notes-offline.zip
  RELEASE_TAG: offline-latest

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: .github/scripts/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install tailwindcss (build script only, unrelated to source)
        working-directory: .github/scripts
        run: npm ci

      - name: Cache CDN assets (Font Awesome, Pretendard, MathJax, vendor JS)
        uses: actions/cache@v6
        with:
          path: dist-assets-cache
          # 자산 URL·버전은 build_offline.py 안에 박혀 있으므로, 그 파일이
          # 바뀔 때만(=버전이 바뀔 때만) 캐시를 새로 받는다.
          key: offline-assets-${{ hashFiles('.github/scripts/build_offline.py') }}

      - name: Restore cache into dist/assets
        run: |
          mkdir -p dist
          if [ -d dist-assets-cache ] && [ -n "$(ls -A dist-assets-cache 2>/dev/null)" ]; then
            cp -r dist-assets-cache dist/assets
            echo "캐시된 자산 재사용"
          else
            echo "캐시 없음 — 이번 실행에서 전부 새로 받음"
          fi

      - name: Build offline bundle
        run: python .github/scripts/build_offline.py --out dist

      - name: Update asset cache for next run
        run: |
          rm -rf dist-assets-cache
          cp -r dist/assets dist-assets-cache

      - name: Verify no CDN references remain
        run: |
          remaining=$(grep -rloE 'https://(cdn|unpkg|cdnjs)[a-zA-Z0-9./_-]*' dist --include='*.html' || true)
          if [ -n "$remaining" ]; then
            echo "::error::로컬화되지 않은 CDN 참조가 남아있습니다:"
            echo "$remaining"
            exit 1
          fi
          echo "CDN 참조 잔존 0건 확인"

      - name: Verify tag nesting
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            if python tools/check_html.py "$f" 2>&1 | grep -q "태그 중첩\] 위반"; then
              echo "::error::태그 중첩 위반: $f"
              fail=1
            fi
          done < <(find dist -iname '*.html' -print0)
          exit $fail

      - name: Record build info
        id: meta
        run: |
          echo "built_at=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"
          cat > dist/BUILD_INFO.txt <<EOF
          빌드 시각: $(date -u +'%Y-%m-%d %H:%M UTC')
          커밋: ${{ github.sha }}
          워크플로 실행: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF

      - name: Create zip archive
        run: cd dist && zip -rq "../${{ env.ZIP_NAME }}" .

      - name: Publish release (fixed tag offline-latest, overwritten each run)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Offline Bundle (auto-updated)
          body: |
            자동 빌드된 오프라인 번들입니다. 커밋마다 이 릴리즈의 자산이 덮어써집니다.

            - 빌드 시각: ${{ steps.meta.outputs.built_at }}
            - 커밋: ${{ github.sha }}
          make_latest: false
          files: ${{ env.ZIP_NAME }}
