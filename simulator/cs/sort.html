<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>정렬 알고리즘 시뮬레이터</title>
    <script type="module" src="/src/entries/simulator/cs/sort.js"></script>
    <link rel="stylesheet" href="/src/styles/simulator.css">

    <style>
        /* 코드·모노스페이스 요소의 한글이 시스템 기본 글꼴로 떨어지는 것을 막는다. */
        code, kbd, samp, pre,
        body .font-mono {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono",
            "Courier New", "Pretendard Variable", Pretendard, "Apple SD Gothic Neo",
            "Malgun Gothic", monospace;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Helvetica Neue", "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }

        .hero-gradient {
            background: linear-gradient(
                    135deg,
                    #881337 0%,
                    #be123c 40%,
                    #e11d48 65%,
                    #f43f5e 100%
            );
        }

        /* 분류 탭 — 개념 지도 역할을 하므로 고른 것이 뚜렷해야 한다. */
        .group-tab {
            padding: 0.75rem 1.25rem;
            font-weight: 700;
            color: #64748b;
            border-bottom: 4px solid transparent;
            transition: color .15s, border-color .15s;
            white-space: nowrap;
        }

        .group-tab:hover {
            color: #e11d48;
        }

        .group-tab.on {
            color: #e11d48;
            border-bottom-color: #e11d48;
        }

        /* 알고리즘 칩 — 같은 분류 안에서 고르는 자리. */
        .algo-chip {
            padding: 0.3rem 0.85rem;
            border-radius: 9999px;
            border: 1px solid #cbd5e1;
            background: #fff;
            color: #475569;
            font-weight: 600;
            white-space: nowrap;
            transition: background-color .15s, color .15s, border-color .15s;
        }

        .algo-chip:hover {
            border-color: #fb7185;
            color: #be123c;
        }

        .algo-chip.on {
            background: #e11d48;
            border-color: #e11d48;
            color: #fff;
        }

        .preset-btn {
            padding: 0.4rem 0.8rem;
            border-radius: 0.5rem;
            border: 1px solid #cbd5e1;
            background: #fff;
            font-weight: 600;
            color: #475569;
            white-space: nowrap;
        }

        .preset-btn.on {
            background: #0f172a;
            border-color: #0f172a;
            color: #fff;
        }

        .ctrl-btn {
            padding: 0.5rem 0.9rem;
            border-radius: 0.5rem;
            border: 1px solid #cbd5e1;
            background: #fff;
            color: #334155;
            font-weight: 700;
        }

        .ctrl-btn:hover:not(:disabled) {
            background: #f1f5f9;
        }

        .ctrl-btn:disabled {
            opacity: .45;
            cursor: not-allowed;
        }

        /* **`min-width`를 주지 않는다.** 「재생 → 멈춤 → 다시」로 글자가 바뀌어도 너비가
           흔들리지 않게 하려고 7.5rem을 박아 두었는데, 좁은 화면에서 이 버튼이 3열 격자의
           칸(약 98px)보다 넓어져 **옆 버튼 위로 22px 올라탔다.** 너비를 붙드는 일은
           격자 칸(`w-full`)과 데스크톱의 `sm:w-32`가 이미 하고 있다. */
        .ctrl-main {
            background: #e11d48;
            border-color: #e11d48;
            color: #fff;
        }

        .ctrl-main:hover:not(:disabled) {
            background: #be123c;
        }

        /* 세는 횟수는 자릿수가 계속 바뀐다. 고정폭 숫자로 두어야 글자가 들썩이지 않는다. */
        .tally {
            font-variant-numeric: tabular-nums;
        }

        body pre {
            overflow-x: auto;
            max-width: 100%;
            min-width: 0;
        }
    </style>
</head>
<body class="antialiased">

<header class="hero-gradient text-white py-20 px-6">
    <div class="max-w-4xl mx-auto text-center">
        <span class="inline-block px-4 py-1.5 bg-white/20 rounded-full font-bold mb-5 backdrop-blur-md shadow-sm">컴퓨터 과학 실습</span>
        <h1 class="text-4xl md:text-5xl lg:text-6xl font-black mb-5 leading-tight tracking-tight">정렬 알고리즘 시뮬레이터</h1>
        <p class="text-lg md:text-xl opacity-90 font-medium max-w-2xl mx-auto leading-relaxed">
            같은 자료를 여러 정렬에 넣어 보고, 한 단계씩 앞뒤로 오가며
            <span class="font-black">무엇을 비교하고 무엇을 옮기는지</span> 확인해 보세요.
        </p>
    </div>
</header>

<main class="max-w-7xl mx-auto mt-8 px-2 sm:px-4 pb-20">

    <!-- 무대 — **탭 줄과 조작까지 이 안에 둔다.**
         전체 화면은 교사가 그것만 켜 놓고 수업을 끌고 갈 수 있어야 뜻이 있다.
         예전에는 무대가 「그림 + 재생 줄」까지여서, 전체 화면에 들어가면
         알고리즘을 바꾸지도 자료를 갈지도 못했다 → src/styles/simulator.css -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 mb-5 fs-stage sim-deck" id="stage">

        <div class="sim-tabbar flex items-center gap-2 px-2 rounded-t-2xl">
            <div class="min-w-0 grow">
                <div class="flex flex-nowrap overflow-x-auto justify-start sm:justify-center" id="group-tabs"></div>
                <div class="flex flex-nowrap overflow-x-auto justify-start sm:justify-center gap-2 py-2 border-t border-slate-100"
                     id="algo-tabs"></div>
            </div>
            <button class="ctrl-btn shrink-0" data-fullscreen="stage" title="전체 화면" type="button">
                <i class="fa-solid fa-expand"></i>
            </button>
        </div>

        <!-- **시키는 곳(fs-side)과 보는 곳(fs-main)을 가른다** → simulator.css 의 `sim-deck`.
             막대 그림은 가로로 길어 조작이 위 띠가 되고, 힙 정렬과 알고리즘 비교는 세로로
             커서 왼쪽 칸이 된다(`sort-ui.js` 가 모양을 붙인다). -->
        <div class="p-5 fs-fill fs-cols">
          <div class="fs-main">
            <!-- 설명은 그림 «위»에 두고 **높이를 못박는다**(`sim-say`). 단계마다 글 길이가
                 달라도 그 아래 그림과 재생 버튼이 움직이지 않는다. -->
            <p class="font-bold text-slate-800 leading-relaxed sim-say" id="say">&nbsp;</p>

            <div class="fs-grow" id="bars-host"></div>

            <div class="mt-3">
                <input class="w-full" id="scrub" max="0" min="0" step="1" type="range" value="0">

                <!-- **자주 누르는 셋을 한 줄에 모은다.** 좁을 때는 3열 격자로 못박아
                     뒤로·재생·앞으로가 늘 한 줄에 오고, 너비도 못박아 글자가 「재생 → 멈춤 →
                     다시」로 바뀌어도 줄바꿈 자리가 흔들리지 않는다. -->
                <div class="grid grid-cols-3 gap-2 mt-2 sm:flex sm:flex-wrap sm:items-center">
                    <button class="ctrl-btn w-full sm:w-28" id="btn-prev" title="한 단계 뒤로" type="button">
                        <i class="fa-solid fa-caret-left"></i> 뒤로
                    </button>
                    <button class="ctrl-btn ctrl-main w-full sm:w-32" id="btn-play" type="button">
                        <i class="fa-solid fa-play"></i> 재생
                    </button>
                    <button class="ctrl-btn w-full sm:w-28" id="btn-next" title="한 단계 앞으로" type="button">
                        앞으로 <i class="fa-solid fa-caret-right"></i>
                    </button>
                    <button class="ctrl-btn w-full sm:w-14" id="btn-first" title="처음으로" type="button">
                        <i class="fa-solid fa-backward-fast"></i>
                    </button>
                    <button class="ctrl-btn w-full sm:w-14" id="btn-last" title="끝으로" type="button">
                        <i class="fa-solid fa-forward-fast"></i>
                    </button>
                    <select class="ctrl-btn w-full sm:w-28" id="speed"></select>

                    <!-- 단계 표시는 세는 횟수 줄 «밖»에 둔다. 알고리즘 비교에서는 합계가 뜻이
                         없어 그 줄을 감추는데, 단계는 그때도 필요하다. -->
                    <div class="col-span-3 flex flex-wrap items-center gap-x-5 gap-y-1 font-semibold text-slate-600 sm:ml-auto">
                        <span class="text-slate-400 tally" id="step-label">0 / 0 단계</span>
                        <span class="flex flex-wrap items-center gap-x-5 gap-y-1" id="tally-row">
                            <span>비교 <span class="font-black text-slate-900 tally" id="count-compare">0</span></span>
                            <span>옮김 <span class="font-black text-slate-900 tally" id="count-move">0</span></span>
                            <span>배열 접근 <span class="font-black text-slate-900 tally" id="count-access">0</span></span>
                        </span>
                    </div>
                </div>
            </div>
          </div><!-- /fs-main -->

          <!-- 시키는 곳 — ① 자료의 모양을 고르고 ② 개수를 정한다. 흐름 순서대로 놓는다.
               **자료를 바꿔도 재생하지 않는다** — 교사가 설명하고 재생을 따로 누른다. -->
          <div class="fs-side">
            <div class="sim-panel max-w-md">
                <h3 class="font-black text-slate-900 mb-2">① 자료의 모양</h3>
                <div class="flex flex-wrap gap-2" id="preset-buttons"></div>
                <!-- 안내는 모양마다 길이가 달라 **두 줄 높이를 늘 잡아 둔다** — 모양을 바꿀
                     때마다 띠가 자라면 그 아래 그림이 들썩인다. -->
                <p class="text-slate-600 font-medium mt-2 min-h-[3.25rem]" id="preset-hint">&nbsp;</p>
            </div>

            <div class="sim-panel">
                <h3 class="font-black text-slate-900 mb-2">② 개수와 직접 입력</h3>
                <!-- 개수와 직접 입력을 **한 줄에** 놓는다 — 띠가 한 줄 줄어든 만큼 막대가 커진다. -->
                <div class="flex flex-wrap items-center gap-x-6 gap-y-2">
                    <div class="flex items-center gap-3 grow basis-64">
                        <label class="font-bold text-slate-700 shrink-0" for="n-slider">개수</label>
                        <input class="flex-1 min-w-0" id="n-slider" max="25" min="0" step="1" type="range" value="6">
                        <span class="font-black text-slate-900 tally shrink-0 w-12 text-right" id="n-label">8</span>
                        <button class="ctrl-btn shrink-0" id="btn-shuffle" type="button">새 자료</button>
                    </div>
                    <!-- **직접 입력은 늘 보이는 한 줄이다.** 여닫는 상자는 열 때마다 칸이 자라
                         화면이 흔들린다. -->
                    <div class="flex items-center gap-2 grow basis-64">
                        <label class="font-bold text-slate-700 shrink-0" for="input-text">직접 입력</label>
                        <input class="w-0 min-w-0 flex-1 border border-slate-300 rounded-lg px-2 py-1.5 font-mono"
                               id="input-text" type="text" value="5, 3, 8, 3, 1, 9, 2, 7"
                               title="정수를 쉼표나 빈칸으로 구분해 적습니다. 같은 값을 일부러 겹쳐 넣으면 안정 정렬인지 아닌지가 눈에 보입니다.">
                        <button class="ctrl-btn shrink-0" id="btn-apply-input" type="button">교체</button>
                    </div>
                </div>
                <!-- 알림과 기록 안내는 **두 줄 높이를 함께 잡아 둔다.** 개수 막대를 끌 때마다
                     안내가 생겼다 사라지면 띠가 자랐다 줄어 그림이 덜컥거린다. -->
                <div class="mt-2 min-h-[3.25rem]">
                    <p class="font-semibold text-rose-600" id="input-error">&nbsp;</p>
                    <p class="text-slate-500 font-medium" id="record-note">&nbsp;</p>
                </div>
            </div>

            <!-- 비교 탭에서만 나온다. 수업에서 배운 것만 골라 비교할 수 있어야 한다.
                 **`fs-hide`를 주지 않는다** — 그것도 조작이다. -->
            <div class="sim-panel sim-panel-row hidden" id="race-picker">
                <div class="flex flex-wrap items-center gap-x-3 gap-y-2 mb-2">
                    <h3 class="font-black text-slate-900">③ 비교할 알고리즘</h3>
                    <button class="ctrl-btn" id="btn-race-all" type="button">모두 선택</button>
                    <button class="ctrl-btn" id="btn-race-none" type="button">모두 해제</button>
                </div>
                <div class="flex flex-wrap gap-x-4 gap-y-2" id="race-checks"></div>
            </div>
          </div><!-- /fs-side -->
        </div><!-- /fs-cols -->
    </div><!-- /stage -->
    <!-- 화면 읽는 법 — **시뮬레이터의 «조작과 표시»만 설명한다.**
         예전에는 안정 정렬의 뜻, 분배 정렬이 왜 비교를 안 하는지까지 여기 적어 두었는데,
         그것은 강의노트가 할 말이지 시뮬레이터가 할 말이 아니다. 게다가 어느 알고리즘을
         골랐든 늘 같은 글이 다섯 문단 붙어 있어, 정작 지금 화면에 있는 것을 찾기 어려웠다.
         이제 **지금 화면에 실제로 나오는 것만** 코드가 골라 채운다 → `sort-ui.js` -->
    <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 mb-5">
        <h3 class="font-black text-slate-900 mb-3">화면 읽는 법</h3>
        <div class="flex flex-wrap gap-x-5 gap-y-2 font-semibold text-slate-700" id="legend"></div>
        <ul class="mt-3 space-y-1 text-slate-600 font-medium list-disc list-outside pl-5" id="read-notes"></ul>
    </section>
    <!-- 고른 알고리즘이 무엇인지 -->
    <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 mb-5">
        <div class="flex flex-col sm:flex-row sm:items-baseline gap-x-3 gap-y-1 mb-2">
            <h2 class="text-2xl font-black text-slate-900" id="algo-name">&nbsp;</h2>
            <p class="font-semibold text-slate-400" id="algo-en">&nbsp;</p>
        </div>
        <p class="leading-relaxed text-slate-700 font-medium mb-4" id="algo-idea">&nbsp;</p>

        <div class="flex flex-wrap gap-2 mb-4" id="algo-badges"></div>

        <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 mb-4">
            <p class="font-black text-slate-900 mb-1" id="group-name">&nbsp;</p>
            <p class="leading-relaxed text-slate-600 font-medium" id="group-blurb">&nbsp;</p>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse" id="algo-complexity"></table>
        </div>
    </section>
    <!-- 눈여겨볼 것 -->
    <section class="bg-amber-50 border border-amber-200 rounded-2xl p-5">
        <div class="flex items-start gap-3">
            <i class="fa-solid fa-lightbulb text-amber-500 mt-1 shrink-0"></i>
            <div class="min-w-0">
                <h3 class="font-black text-amber-900 mb-2">이 알고리즘에서 눈여겨볼 것</h3>
                <p class="text-amber-900 font-medium leading-relaxed" id="algo-watch">&nbsp;</p>
            </div>
        </div>
    </section>

</main>

<footer class="bg-white border-t border-slate-200 mt-20 px-6 py-5">
    <div class="max-w-6xl mx-auto flex items-center justify-center gap-1">
        <a href="../../index.html" title="자료 목록" aria-label="자료 목록"
           class="w-11 h-11 grid place-items-center rounded-lg text-slate-500 hover:text-indigo-600 hover:bg-slate-100 transition-colors"><i class="fa-solid fa-house text-base"></i></a>
        <a href="https://github.com/itmir913/Visual-Assets-for-CS-Teacher" target="_blank" rel="noopener noreferrer"
           title="GitHub 저장소" aria-label="GitHub 저장소"

        <span class="text-base text-slate-400 ml-2">&copy; luminousky</span>
    </div>
</footer>

</body>
