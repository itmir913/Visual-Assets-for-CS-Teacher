<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>main이 없는 노트</title>
</head>
<body>

<!-- 일부러 틀린 조각 — 본문을 <main> 밖에 두었다. 색인은 <main> 안만 담으므로 이 노트는
     레코드가 하나도 안 생기고, 학생이 어떤 말로 찾아도 이 편은 나오지 않는다. -->
<header id="top">
    <h1>main이 없는 노트</h1>
</header>

<section id="sec1">
    <h2>본문이 main 밖에 있다</h2>
    <p>이 글은 색인에 들지 않는다.</p>
</section>

</body>
</html>
