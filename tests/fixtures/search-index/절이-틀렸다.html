<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>절이 틀렸다</title>
</head>
<body>

<header id="top">
    <h1>절이 틀렸다</h1>
</header>

<main>
    <!-- 일부러 틀린 조각 둘 —
         ① 절 제목이 없다(결과에 떠도 무엇인지 알 수 없다)
         ② 아래 푸터의 글이 절 안에 그대로 있다(색인이 <main>보다 큰 그릇을 담았을 때의 모습이다)
         겹친 `id` 는 여기서 보지 않는다 — `check -- html` 의 「중복 id」가 본다. -->
    <section id="first">
        <h2>첫 절</h2>
        <p>&copy; luminousky — 푸터의 저작권 줄이 절 안에 있다</p>
    </section>

    <section id="no-heading">
        <p>절 제목이 없는 절이다.</p>
    </section>
</main>

<footer>
    <p>&copy; luminousky</p>
</footer>

</body>
</html>
