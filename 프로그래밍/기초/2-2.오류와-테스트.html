<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오류와 테스트</title>
    <link rel="stylesheet" href="/src/styles/programming.css">
    <style>
        /* 코드·모노스페이스 요소의 한글이 시스템 기본 글꼴로 떨어지는 것을 막는다.
           라틴 문자는 모노스페이스, 한글은 Pretendard로 렌더링된다.

           `code, pre`처럼 요소 선택자만 쓰면 Tailwind CDN이 나중에 주입하는 Preflight의
           동일 특이도 규칙(`code,kbd,samp,pre{font-family:...}`)에 밀려 한글이 시스템
           글꼴로 떨어진다. 그래서 `body`를 붙여 특이도를 한 단계 올린다. */
        body code, body kbd, body samp, body pre,
        body .font-mono {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono",
            "Courier New", "Pretendard Variable", Pretendard, "Apple SD Gothic Neo",
            "Malgun Gothic", monospace;
        }

        body pre {
            overflow-x: auto; /* 넘치는 줄은 코드 블록 안에서만 가로 스크롤 */
            max-width: 100%;
            min-width: 0; /* flex 자식일 때 정상적으로 줄어들도록 */
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto,
            "Helvetica Neue", "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic",
            "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", sans-serif;
            background-color: #f8fafc;
        }

        .hero-gradient {
            background: linear-gradient(135deg, #ea580c 0%, #c2410c 100%);
        }

        .sticky-nav {
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(12px);
            background-color: rgba(255, 255, 255, 0.9);
            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .section-card {
            background: white;
            padding: 2.5rem;
            border-radius: 2rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
            border: 1px solid #f1f5f9;
            transition: all 0.3s ease;
        }

        .quiz-btn {
            width: 100%;
            padding: 1.25rem;
            text-align: left;
            border-radius: 1rem;
            border: 2px solid #e2e8f0;
            background-color: #f8fafc;
            font-weight: 500;
            color: #374151;
            font-size: 1rem;
            transition: all 0.25s ease;
            cursor: pointer;
        }

        .quiz-btn:hover {
            background: #fff7ed;
            border-color: #fdba74;
        }

        .quiz-btn.correct {
            background: #ea580c;
            color: white;
            border-color: #ea580c;
        }

        .quiz-btn.wrong {
            background: #f43f5e;
            color: white;
            border-color: #f43f5e;
        }

        .quiz-btn.disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        th, td {
            border: 1px solid #e2e8f0;
            padding: 0.75rem 1rem;
            text-align: left;
            font-size: 1rem;
        }

        thead th {
            background-color: #f1f5f9;
            font-weight: 700;
            color: #334155;
        }

        tbody tr:nth-child(even) {
            background-color: #f8fafc;
        }

        tbody tr:hover {
            background-color: #fff7ed;
        }

        /* 375px에서 본문이 긴 셀이 100px 안팎으로 눌려 세로 리본처럼 찌그러진다.
           `table{width:100%}` 때문에 래퍼가 있어도 넘치지 않고 눌리기 때문이다.
           최소 너비를 주면 눌리는 대신 래퍼(.overflow-x-auto) 안에서 가로 스크롤된다.
           값이 짧은 2열 표에는 붙이지 않는다. 굳이 넓힐 이유가 없다. */
        table.table-prose {
            min-width: 32rem;
        }

        /* 프로그램·사이트 안의 고유 이름을 본문과 구별해 표시한다.

           `font-mono`를 쓰지 않는다. 화면에 적힌 이름은 코드가 아니라서 모노스페이스로 두면
           코드처럼 읽히고 한글 본문과 글꼴이 튀어 문장이 끊긴다.
           `inline-block` + `nowrap`은 긴 이름이 375px를 뚫으므로 쓰지 않는다. */
        .widget-name,
        .attr-name {
            display: inline;
            -webkit-box-decoration-break: clone;
            box-decoration-break: clone;
            font-weight: 700;
            border-radius: 0.5rem;
            padding: 0.05rem 0.45rem;
            letter-spacing: 0.01em;
        }

        .widget-name { /* 메뉴 이름 · 설정 이름 */
            color: #6b21a8;
            background: #f3e8ff;
            border: 1px solid #d8b4fe;
        }

        .attr-name { /* 파일명 · 속성명 */
            color: #334155;
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
        }

        /* 외부 사이트 주소는 반드시 눌러서 갈 수 있어야 한다. 학생이 주소를 손으로 옮겨 적게 두지 않는다.
           긴 주소가 375px를 뚫으므로 break-all을 함께 준다. */
        a.ext-link {
            color: #4338ca;
            font-weight: 600;
            text-decoration: underline;
            text-underline-offset: 2px;
            word-break: break-all;
        }

        a.ext-link:hover {
            color: #312e81;
        }

        /* 차트 예시 그림. 글자를 넣지 않고 도형만 그린 뒤 설명은 HTML로 붙인다.
           SVG 안의 글자는 375px에서 뷰박스와 함께 줄어들어 최소 글자 크기 규칙을 어긴다. */
        .chart-svg {
            width: 100%;
            height: auto;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 0.75rem;
        }

        details > summary {
            cursor: pointer;
            list-style: none;
        }

        details > summary::-webkit-details-marker {
            display: none;
        }

        details[open] > summary .details-chevron {
            transform: rotate(90deg);
        }

        .details-chevron {
            transition: transform 0.2s ease;
        }
    </style>
</head>
<body class="text-slate-900">

<script>
    function checkAnswer(btn, isCorrect, message) {
        const container = btn.closest('[id^="q"]');
        const buttons = container.querySelectorAll('.quiz-btn');

        buttons.forEach(b => b.classList.add('disabled'));

        if (isCorrect) {
            btn.classList.add('correct');
            btn.innerHTML = '<i class="fa-solid fa-circle-check mr-2"></i>' + btn.textContent.trim();
            showToast('✅ ' + message, 'success');
        } else {
            btn.classList.add('wrong');
            btn.innerHTML = '<i class="fa-solid fa-circle-xmark mr-2"></i>' + btn.textContent.trim();
            showToast('❌ ' + message, 'error');
        }

        setTimeout(() => {
            buttons.forEach(b => {
                b.classList.remove('disabled', 'correct', 'wrong');
                const text = b.textContent.trim().replace(/^[✅❌]\s*/, '');
                b.innerHTML = text;
            });
        }, 3000);
    }

    function showToast(message, type) {
        const existing = document.getElementById('toast-msg');
        if (existing) existing.remove();

        const toast = document.createElement('div');
        toast.id = 'toast-msg';
        toast.style.cssText = `
            position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(2rem);
            padding: 1rem 1.5rem; border-radius: 1rem; font-weight: 700; font-size: 1rem;
            box-shadow: 0 8px 24px rgba(0,0,0,0.18); z-index: 9999; max-width: 90vw; text-align: center;
            transition: all 0.3s ease; opacity: 0;
            ${type === 'success'
            ? 'background: #ea580c; color: white;'
            : 'background: #f43f5e; color: white;'}
        `;
        toast.textContent = message;
        document.body.appendChild(toast);

        requestAnimationFrame(() => {
            toast.style.opacity = '1';
            toast.style.transform = 'translateX(-50%) translateY(0)';
        });

        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transform = 'translateX(-50%) translateY(2rem)';
            setTimeout(() => toast.remove(), 300);
        }, 3000);
    }
</script>
